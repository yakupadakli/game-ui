name: game_ui
description: Game-style UI widgets for Flutter
version: 0.1.0+1
publish_to: none
repository: https://github.com/yakupadakli/game-ui

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Asset directories are added here as PNG/font files arrive.
  # Example (uncomment + adjust when assets are added):
  #
  assets:
    - assets/images/buttons/
    - assets/images/cards/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 300
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 700
    - family: BalooChettan2
      fonts:
        - asset: assets/fonts/BalooChettan2-Variable.ttf
          weight: 400
        - asset: assets/fonts/BalooChettan2-Variable.ttf
          weight: 500
        - asset: assets/fonts/BalooChettan2-Variable.ttf
          weight: 600
        - asset: assets/fonts/BalooChettan2-Variable.ttf
          weight: 700
        - asset: assets/fonts/BalooChettan2-Variable.ttf
          weight: 800
